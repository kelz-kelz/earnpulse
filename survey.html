
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EarnPulse | Surveys</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#071b2b;color:white;font-family:Arial,sans-serif}
header{background:#102b40;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{color:#39d9a2;font-size:21px;font-weight:bold}
main{max-width:800px;margin:auto;padding:20px}
.card{background:#102b40;padding:20px;border-radius:13px;margin:18px 0}
h2{color:#39d9a2}
p{line-height:1.5;color:#c5d5df}
button{background:#39d9a2;color:#071b2b;border:0;padding:12px 18px;border-radius:8px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea,select{width:100%;padding:13px;margin:10px 0 18px;background:#071b2b;color:white;border:1px solid #34536a;border-radius:8px;font-size:15px}
label{display:block;font-weight:bold;margin-top:12px}
.muted{color:#a9bfce}
.message{padding:12px;border-radius:8px;margin:12px 0}
.survey{border-bottom:1px solid #34536a;padding:15px 0}
</style>
</head>
<body>

<header>
 <div class="logo">EarnPulse Kenya</div>
 <button onclick="location.href='./dashboard.html'">Dashboard</button>
</header>

<main>
 <h2>Available Surveys</h2>
 <p class="muted">Choose an available research survey and share your opinions.</p>

 <div id="message" class="muted">Checking your account...</div>
 <div id="surveyList"></div>
 <div id="surveyForm"></div>
</main>

<script>
const SUPABASE_URL =
 "https://dgbgvhrdzedtlkrntvkv.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_1gHSU6-oWGjoGwuEai_a5w_QQLZ_aVN";

const db = window.supabase.createClient(
 SUPABASE_URL, SUPABASE_KEY
);

let currentUser = null;
let selectedSurvey = null;

const message = document.getElementById("message");
const surveyList = document.getElementById("surveyList");
const surveyForm = document.getElementById("surveyForm");

function showMessage(text){
 message.textContent = text;
}

async function start(){
 const {data:{session},error} = await db.auth.getSession();

 if(error || !session){
  location.replace("./auth.html");
  return;
 }

 currentUser = session.user;
 await loadSurveys();
}

async function loadSurveys(){
 showMessage("Loading surveys...");

 const {data:surveys,error} = await db
  .from("surveys")
  .select("id,title,description,questions")
  .eq("status","published");

 if(error){
  showMessage("Unable to load surveys: " + error.message);
  return;
 }

 const {data:responses,error:responseError} = await db
  .from("survey_responses")
  .select("survey_id")
  .eq("member_id",currentUser.id);

 if(responseError){
  showMessage("Unable to check completed surveys.");
  return;
 }

 const completed = new Set(
  responses.map(item => item.survey_id)
 );

 surveyList.innerHTML = "";
 surveyForm.innerHTML = "";

 if(!surveys.length){
  showMessage("There are currently no published surveys.");
  return;
 }

 showMessage("Choose a survey below.");

 surveys.forEach(survey=>{
  const card = document.createElement("div");
  card.className = "card survey";

  const title = document.createElement("h3");
  title.textContent = survey.title;

  const description = document.createElement("p");
  description.textContent = survey.description || "";

  const button = document.createElement("button");

  if(completed.has(survey.id)){
   button.textContent = "Already completed";
   button.disabled = true;
  }else{
   button.textContent = "Open Survey";
   button.addEventListener("click",()=>openSurvey(survey));
  }

  card.append(title,description,button);
  surveyList.appendChild(card);
 });
}

function openSurvey(survey){
 selectedSurvey = survey;
 surveyForm.innerHTML = "";

 const questions = Array.isArray(survey.questions)
  ? survey.questions : [];

 if(!questions.length){
  showMessage("This survey has no questions yet.");
  return;
 }

 const card = document.createElement("div");
 card.className = "card";

 const heading = document.createElement("h2");
 heading.textContent = survey.title;
 card.appendChild(heading);

 const form = document.createElement("form");

 questions.forEach((q,index)=>{
  const label = document.createElement("label");
  label.textContent = (index+1) + ". " + q.question;
  form.appendChild(label);

  let field;

  if(q.type === "textarea"){
   field = document.createElement("textarea");
   field.rows = 4;
  }else if(q.type === "select"){
   field = document.createElement("select");

   const empty = document.createElement("option");
   empty.value = "";
   empty.textContent = "Choose an answer";
   field.appendChild(empty);

   (q.options || []).forEach(option=>{
    const item = document.createElement("option");
    item.value = option;
    item.textContent = option;
    field.appendChild(item);
   });
  }else{
   field = document.createElement("input");
   field.type = "text";
  }

  field.name = "question_" + index;
  field.required = true;
  form.appendChild(field);
 });

 const submit = document.createElement("button");
 submit.type = "submit";
 submit.textContent = "Submit Answers";
 form.appendChild(submit);

 form.addEventListener("submit",submitSurvey);

 card.appendChild(form);
 surveyForm.appendChild(card);

 card.scrollIntoView({behavior:"smooth"});
}

async function submitSurvey(event){
 event.preventDefault();

 if(!selectedSurvey || !currentUser) return;

 const form = event.currentTarget;
 const button = form.querySelector("button[type=submit]");
 button.disabled = true;
 button.textContent = "Submitting...";

 const questions = selectedSurvey.questions;
 const answers = {};

 questions.forEach((q,index)=>{
  answers[q.question] =
   form.elements["question_" + index].value.trim();
 });

 const {error} = await db
  .from("survey_responses")
  .insert({
   survey_id:selectedSurvey.id,
   member_id:currentUser.id,
   answers:answers
  });

 if(error){
  showMessage(
   error.code === "23505"
    ? "You have already completed this survey."
    : "Submission failed: " + error.message
  );
  button.disabled = false;
  button.textContent = "Submit Answers";
  return;
 }

 surveyForm.innerHTML = "";
 showMessage("Your answers have been submitted successfully! Thank you.");
 await loadSurveys();
}

start();
</script>
</body>
</html>

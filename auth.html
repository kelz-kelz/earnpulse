
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EarnPulse Kenya | Account</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #071b2b;
      color: white;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }
    .card {
      background: #102b40;
      width: 100%;
      max-width: 420px;
      padding: 28px;
      border-radius: 18px;
      box-shadow: 0 10px 35px #0005;
    }
    h1 { color: #39d9a2; text-align: center; }
    p { color: #b8cbd7; text-align: center; }
    input {
      width: 100%;
      padding: 14px;
      margin: 9px 0;
      border: 1px solid #34536a;
      border-radius: 8px;
      background: #071b2b;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: 0;
      border-radius: 8px;
      background: #39d9a2;
      color: #071b2b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    .switch {
      background: transparent;
      color: #39d9a2;
      border: 1px solid #39d9a2;
    }
    #message { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>EarnPulse Kenya</h1>
    <p id="subtitle">Create your member account</p>

    <form id="authForm">
      <input id="name" type="text" placeholder="Full name" required>
      <input id="email" type="email" placeholder="Email address" required>
      <input id="password" type="password" placeholder="Password (minimum 8 characters)" minlength="8" required>
      <button id="submitBtn" type="submit">Create Account</button>
    </form>

    <button class="switch" id="switchBtn" type="button">
      Already registered? Login
    </button>

    <p id="message" role="status"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://dgbgvhrdzedtlkrntvkv.supabase.co";
    const SUPABASE_KEY = "sb_publishable_1gHSU6-oWGjoGwuEai_a5w_QQLZ_aVN";

    const client = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    let isLogin = false;

    const form = document.getElementById("authForm");
    const nameInput = document.getElementById("name");
    const subtitle = document.getElementById("subtitle");
    const submitBtn = document.getElementById("submitBtn");
    const switchBtn = document.getElementById("switchBtn");
    const message = document.getElementById("message");

    switchBtn.addEventListener("click", () => {
      isLogin = !isLogin;
      nameInput.style.display = isLogin ? "none" : "block";
      nameInput.required = !isLogin;
      subtitle.textContent = isLogin ? "Welcome back" : "Create your member account";
      submitBtn.textContent = isLogin ? "Login" : "Create Account";
      switchBtn.textContent = isLogin ? "New member? Register" : "Already registered? Login";
      message.textContent = "";
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "Please wait...";
      submitBtn.disabled = true;

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const name = nameInput.value.trim();

      try {
        if (isLogin) {
          const { error } = await client.auth.signInWithPassword({
            email, password
          });
          if (error) throw error;

          message.textContent = "Login successful! Welcome to EarnPulse.";
        } else {
          const { data, error } = await client.auth.signUp({
            email,
            password,
            options: {
              data: { display_name: name }
            }
          });
          if (error) throw error;

          message.textContent = data.session
            ? "Account created successfully!"
            : "Account created! Check your email to confirm your account.";
        }
      } catch (error) {
        message.textContent = error.message;
      } finally {
        submitBtn.disabled = false;
      }
    });

    client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_IN" && session) {
        message.textContent = "You're signed in successfully!";
      }
    });
  </script>
</body>
</html>
